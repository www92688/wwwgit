[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ych"
version = "0.1.0"
description = "源重构——爽文短视频素材采集、预处理与智能去重工具"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [{ name = "YuChongGou" }]
keywords = ["video", "dedup", "pyqt", "pyside6", "ffmpeg"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Windows",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "PySide6>=6.6,<7",
    "opencv-python-headless>=4.9,<5",
    "onnxruntime>=1.17",
    # 上限钉住 2.x：其类型存根使用 PEP 695 语法，mypy 以 python_version=3.10
    # 解析会报错（DEC-006）；1.26 为详设 2.1 声明的下限版本
    "numpy>=1.26,<2",
    "requests>=2.31",
    "keyring>=24",
]

[project.urls]
Homepage = "https://github.com/YuChongGou/YuChongGou"
Repository = "https://github.com/YuChongGou/YuChongGou"
Issues = "https://github.com/YuChongGou/YuChongGou/issues"
Documentation = "https://github.com/YuChongGou/YuChongGou#readme"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-qt",
    "pytest-cov",
    "responses",
    "mypy",
    "ruff",
    "pyinstaller>=6.0",
]
# 内置抖音下载器（vendor/douyin_downloader）的子进程运行依赖
douyin = [
    "aiohttp>=3.9",
    "httpx>=0.25",
    "aiofiles>=23.2",
    "aiosqlite>=0.19",
    "rich>=13.7",
    "pyyaml>=6.0",
    "python-dateutil>=2.8",
    "gmssl>=3.2",
    "imageio-ffmpeg==0.6.0",
    "playwright>=1.40",
]

[project.scripts]
ych = "ych.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# RUF001/002/003：中文全角标点被标记为"歧义字符"。
# 本项目硬约束要求注释与用户文案为简体中文，全角标点属正常中文排版，显式豁免（DEC-007）。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
strict = true
python_version = "3.10"
files = ["src"]

# 仅豁免无 stub 的第三方库，业务代码全量严格
[[tool.mypy.overrides]]
module = [
    "cv2.*",
    "onnxruntime.*",
    "keyring.*",
    "keyring.errors",
    "pytestqt.*",
    "responses.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "integration: 需要真实 ffmpeg 的端到端用例（缺失自动跳过）",
]

[tool.coverage.run]
branch = true
source = ["ych"]
omit = [
    "*/tests/*",
    "*/spikes/*",
    "*/scripts/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
